<!doctype html>
<html data-theme="dark">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      // Kept in sync with Quasar's own $q.dark state by src/boot/theme.ts.
      try {
        var t = localStorage.getItem('msm-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
