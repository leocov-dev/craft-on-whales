# Local example: builds the panel image FROM SOURCE (the repo you're standing
# in) instead of pulling ghcr.io/leocov-dev/craft-on-whales:latest. Good for
# trying out an unreleased change, or just running the panel locally without
# needing a registry pull.
#
# Usage (from this directory):
#   docker compose up --build
#   open http://localhost:3000
#
# All panel data (worlds, mods, backups, the DB) lands in ./data next to this
# file — delete that folder to reset the panel to a clean slate.
services:
  panel:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: craft-on-whales-local
    restart: unless-stopped
    ports:
      # Web UI. Change the left side to move it; the panel itself listens on
      # 3000 in-container.
      - '${PANEL_PORT_HOST:-3000}:3000'
    extra_hosts:
      # Lets the panel container reach sibling containers' HOST-published
      # ports (e.g. BlueMap's live map) via host.docker.internal. Docker
      # Desktop resolves this for free; plain Linux Engine needs it mapped
      # explicitly (Docker Engine 20.10+).
      - 'host.docker.internal:host-gateway'
    environment:
      # $PWD is this directory (docker compose expands it from your shell at
      # `up` time) — the panel needs its OWN absolute view of the host path
      # backing ./data, since it hands that path to sibling Minecraft server
      # containers as their bind-mount source. A relative path here would
      # bind-mount the wrong thing on those containers.
      DATA_DIR_HOST: ${DATA_DIR_HOST:-${PWD}/data}
      # Uncomment to pin the session/crypto secret instead of the
      # auto-generated one (regenerated on every `data` wipe otherwise):
      # SESSION_SECRET: change-me-to-a-long-random-string
      #
      # Optional: use Postgres instead of the default SQLite file (uncomment
      # both this and the `db` service below, and add `depends_on: [db]`).
      # Moving an EXISTING SQLite install over needs a one-time data copy —
      # see tools/sqlite-to-postgres/README.md.
      # DB_DRIVER: postgres
      # DATABASE_URL: postgres://panel:panel@db:5432/panel
    volumes:
      - ./data:/data
      # The panel manages servers through the host daemon (create/start/exec).
      - /var/run/docker.sock:/var/run/docker.sock

  # Uncomment to run Postgres instead of the default SQLite file (see the
  # panel service's DB_DRIVER/DATABASE_URL above).
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: panel
  #     POSTGRES_PASSWORD: panel
  #     POSTGRES_DB: panel
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
