name: Release

# Publish a GitHub Release for a pushed version tag (v1.2.3). Notes come straight
# from CHANGELOG.md, so the tag's version must have a matching CHANGELOG entry and
# match package.json (checked below as a sanity guard against tagging before the
# version bump lands). Publishing the release fans out to docker-publish.yml.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ steps.version.outputs.value }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Build release notes from CHANGELOG
        run: node tools/changelog-notes/changelog-notes.js "${{ steps.version.outputs.value }}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md
